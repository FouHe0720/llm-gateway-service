[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway-service"
version = "0.1.0"
description = "An async, observable gateway for Mock and OpenAI-compatible text models"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.8,<5",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<0.29",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
