services:
  gateway:
    build: .
    ports:
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-development}
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-false}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
