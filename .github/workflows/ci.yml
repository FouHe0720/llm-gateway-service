name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'uv==0.12.24'
      - run: uv sync --frozen --extra dev
      - run: make lint test
      - run: make demo
      - run: .venv/bin/python -m scripts.privacy_check
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail http://127.0.0.1:8000/health
      - run: >-
          curl --fail http://127.0.0.1:8000/v1/chat
          -H 'Content-Type: application/json' --data-binary @examples/chat.json
      - run: docker compose down
        if: always()
